{% extends 'userbase.html' %}
{% load static %}
{% block user %}
  <style>
    .card-center { max-width:540px; margin:40px auto; }
    .form-title { font-weight:600; margin-bottom:8px; }
    .help-text { font-size:13px; color:#6c757d; }
  </style>

  <div class="container">
    <div class="card card-center shadow-sm">
      <div class="card-body">
        <h5 class="form-title">Change Password</h5>
        <p class="help-text">Set a secure password. Minimum 8 characters.</p>

       

        <form method="post" novalidate>
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label">Old password</label>
            <input type="password" name="old_password" class="form-control" required autofocus>
          </div>

          <div class="mb-3">
            <label class="form-label">New password</label>
            <input type="password" name="new_password" class="form-control" minlength="8" required>
            <div class="form-text">Use at least 8 characters. Combine letters and numbers for better security.</div>
          </div>

          <div class="mb-3">
            <label class="form-label">Confirm new password</label>
            <input type="password" name="confirm_password" class="form-control" minlength="8" required>
          </div>

          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">Update Password</button>
            <a href="{% url 'userprofile' %}" class="btn btn-outline-secondary">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
{% endblock %}
