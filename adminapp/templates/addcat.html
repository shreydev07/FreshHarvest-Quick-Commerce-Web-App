{% extends 'adminbase.html' %}
{% load static %}
{% block admin %}
<div class="row">
    <div class="col-sm-12">
        <h3>Add New Category</h3>
    </div>
    <div class="col-sm-8 mt-5 mx-auto">
        <div class="card p-4 shadow">
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="n" class="form-label">Category Name</label>
                    <input type="text" name="name" id="n" class="form-control">
                </div>
                <div class="mb-3">
                    <label for="desc" class="form-label">Description</label>
                    <textarea name="description" id="desc" class="form-control"></textarea>
                </div>
                <div class="text-center">
                    <button type="submit" class="btn btn-success mt-4">Add Category</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
