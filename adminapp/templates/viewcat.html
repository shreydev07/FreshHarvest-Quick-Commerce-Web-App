{% extends 'adminbase.html' %} {% load static %} {% block admin %}
<h3 class="text-success text-center">View Categories</h3>
<div class="row">
  <div class="col-sm-12" style="height: 60vh">
    <table class="table table-bordered table-striped">
      <thead>
        <tr>
          <th>S.No</th>
          <th>Category Name</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        {% for cat in cats %}
        <tr>
          <td>{{ forloop.counter }}</td>
          <td>{{ cat.name }}</td>
          <td>
            <a href="{% url 'editcat' cat.id %}" class="btn btn-sm btn-warning">Edit</a>
            <a href="{% url 'deletecat' cat.id %}" class="btn btn-sm btn-danger" onclick="return confirm('Are you sure you want to delete this category?');">Delete</a>
          </td>

        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
  {% endblock %}
</div>
