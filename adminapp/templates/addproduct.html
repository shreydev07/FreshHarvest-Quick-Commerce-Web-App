{% extends 'adminbase.html' %}
{% load static %}
{% block admin %}
<div class="row">
    <div class="col-sm-12">
        <h3>Add New Products</h3>
    </div>
    <div class="col-sm-9 mx-auto mt-4 ">
        <div class="card p-4 shadow">
            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="t" class="form-label">Product Title</label>
                    <input type="text" name="title" id="t" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label for="cat" class="form-label">Select Unit</label>
                    <select name="unit" id="cat" class="form-control" required>
                        <option selected disabled>--Select Unit---</option>
                        {% for u in units %}
                        <option value="{{u.id}}">{{u.name}}</option>
                        {% endfor %}
                    </select>
                </div>


                <div class="mb-3">
                    <label for="cat" class="form-label">Select Category</label>
                    <select name="category" id="cat" class="form-control" required>
                        <option selected disabled>--Select Category---</option>
                        {% for c in cats %}
                        <option value="{{c.id}}">{{c.name}}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="mb-3">
                    <label for="desc" class="form-label">Description</label>
                    <textarea name="description" id="desc" class="form-control"></textarea>
                </div>
                <div class="mb-3">
                    <label for="tp" class="form-label">Tag Price</label>
                    <input type="number" name="original_price" step="0.01" id="tp" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label for="sp" class="form-label">Selling Price</label>
                    <input type="number" name="price" step="0.01" id="sp"  class="form-control" required>
                </div>
                <div class="mb-3">
                    <label for="pd" class="form-label">Added Date</label>
                    <input type="date" name="published_date" id="pd" class="form-control" required>
                </div>
                {% comment %} <div class="mb-3">
                    <label for="lang" class="form-label">Language</label>
                    <input type="text" name="language" id="lang" class="form-control" required>
                </div> {% endcomment %}
                <div class="mb-3">
                    <label for="ci" class="form-label">Cover Image</label>
                    <input type="file" name="cover_image" id="ci" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label for="st" class="form-label">Stock</label>
                    <input type="number" name="stock" id="st" class="form-control" required>
                </div>
                <div class="text-center mt-4">
                    <button type="submit" class="btn btn-success">Add Produts</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
