{% extends 'adminbase.html' %}
{% block admin %}
<div class="container py-4">
  <h3 class="text-center text-primary">Edit Unit</h3>
  <form method="post">
    {% csrf_token %}
    <div class="mb-3">
      <label class="form-label">Unit Name</label>
      <input type="text" name="name" class="form-control" value="{{ unit.name }}" required>
    </div>
    <button type="submit" class="btn btn-success">Update Unit</button>
    <a href="{% url 'viewunit' %}" class="btn btn-secondary">Cancel</a>
  </form>
</div>
{% endblock %}
